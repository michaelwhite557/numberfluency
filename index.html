<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16583f"><title>Number Fluency — Version 1.10</title>
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="manifest" href="./manifest.webmanifest">
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#13372b;background:#f7f5e9;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh}[hidden]{display:none!important}button,select,input{font:inherit}button{touch-action:manipulation;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid #a96c00;outline-offset:3px}
header{background:#16583f;color:white;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px clamp(14px,3vw,34px);min-height:100px}header h1{font-size:clamp(23px,3vw,34px);margin:0;font-weight:850;letter-spacing:.02em}header img{width:clamp(110px,19vw,190px);max-height:88px;object-fit:contain;display:block}.logo-tap{border:0;background:none;padding:2px;border-radius:10px}
main{max-width:1320px;margin:auto;padding:clamp(12px,2vw,24px);display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:white;border:2px solid #cbdacc;border-radius:20px;box-shadow:0 4px 14px #164e3620;padding:clamp(14px,2.2vw,26px);display:flex;flex-direction:column;gap:16px;min-width:0}.panel h2{margin:0;font-size:clamp(21px,2.5vw,28px)}label{font-weight:750}.selector{width:100%;padding:13px;border:2px solid #739c7d;border-radius:12px;background:#fff;color:#13372b;font-size:19px}.digit{display:grid;place-items:center;min-height:clamp(145px,25vh,260px);border:3px solid #c4d4c8;background:#f4f9f2;border-radius:18px;font-size:clamp(76px,13vw,170px);font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;word-break:break-word;text-align:center}.digit.small{font-size:clamp(55px,8vw,105px)}.primary,.secondary,.gold{border:0;border-radius:14px;padding:17px 15px;font-size:clamp(18px,2vw,24px);font-weight:800;min-height:62px}.primary{color:white;background:#176a49}.gold{color:#26340c;background:#f3ca4a}.secondary{color:#154b39;background:#e1eee1;border:2px solid #a6bfad}.primary:active,.gold:active,.secondary:active{transform:scale(.99)}.controls{display:flex;gap:10px;flex-wrap:wrap}.controls>*{flex:1 1 130px}#autoPlay{min-width:0;white-space:nowrap}.time{font-size:clamp(54px,8vw,104px);font-weight:850;font-variant-numeric:tabular-nums;text-align:center;padding:24px 4px;border-radius:16px;background:#f4f9f2;border:3px solid #c4d4c8;line-height:1.15}.modebar,.presets{display:flex;gap:8px;flex-wrap:wrap}.modebar button,.presets button{flex:1 1 90px;border:2px solid #a4bdaa;background:#f5faf4;color:#164b36;border-radius:10px;padding:12px 7px;font-weight:750;min-height:48px}.modebar button[aria-pressed=true],.presets button[aria-pressed=true]{background:#185f45;color:white;border-color:#185f45}.alert{font-weight:850;font-size:clamp(22px,3vw,34px);text-align:center;min-height:44px;color:#125c3c}.alert:empty{display:none}.time.up{background:#ffe59b;border-color:#c88900}.time.pulse{animation:pulse 1.1s ease-in-out 4}@keyframes pulse{50%{background:#f4c944;transform:scale(1.018)}}.sound-option{display:flex;gap:10px;align-items:center;font-size:17px}.sound-option input{width:23px;height:23px;accent-color:#176a49}.note{font-size:14px;color:#446052;margin:0}footer{text-align:right;font-size:13px;color:#567062;padding:0 18px 12px}
#brilliance{position:fixed;inset:0;z-index:10;overflow:auto;display:none;align-items:center;justify-content:center;padding:18px;background:linear-gradient(120deg,#240e65,#0060aa,#188d6b,#f2a700,#b90090);background-size:350% 350%;animation:rainbow 10s ease infinite;color:white}#brilliance.active{display:flex}@keyframes rainbow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}.brilliance-card{width:min(920px,96vw);padding:clamp(16px,3vw,30px);border:5px solid #ffda42;border-radius:23px;background:#130943e8;text-align:center;box-shadow:0 0 45px #ffdd44a0}.brilliance-card img{width:100%;max-height:45vh;object-fit:contain;border-radius:12px}.brilliance-card h2{font-size:clamp(24px,4vw,42px);margin:12px 0}.brilliance-card p{font-size:clamp(22px,3vw,31px);font-weight:850;margin:12px 0 22px;color:#ffe870}.brilliance-card button{font-size:22px;max-width:350px;width:100%}
@media(max-width:690px){main{grid-template-columns:1fr}header{min-height:82px}.digit{min-height:150px}.time{padding:14px}.panel{gap:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* Brilliance Mode: retain the functional app while recolouring the interface. */
body.brilliance-on{background:linear-gradient(115deg,#ffb6df,#fff0a4,#b4f7c2,#b8e1ff,#d9c2ff);background-size:300% 300%;animation:brilliance-bg 14s ease-in-out infinite;color:#302551}
@keyframes brilliance-bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
body.brilliance-on header{background:linear-gradient(95deg,#713ddd,#146ccf,#178c7a,#d78918,#b63c92);background-size:240% 240%;animation:brilliance-bg 14s ease-in-out infinite}
body.brilliance-on .panel{border:4px solid transparent;background:linear-gradient(#fffefa,#fffefa) padding-box,linear-gradient(125deg,#f24b97,#fac545,#37b57d,#459cff,#945be7) border-box;box-shadow:0 4px 25px #a357a54a}
body.brilliance-on .digit,body.brilliance-on .time{background:#fcf4ff;border-color:#b67ae7;color:#6a2fad}
body.brilliance-on .primary,body.brilliance-on .modebar button[aria-pressed=true],body.brilliance-on .presets button[aria-pressed=true]{background:linear-gradient(110deg,#8757df,#ca49a3,#f27f45);color:white;border-color:transparent}
body.brilliance-on .gold{background:#ffe26b}
body.brilliance-on .secondary{border-color:#ba86d7;background:#f0e1fa;color:#4c2781}
body.brilliance-on .alert{color:#7c268f}
body.brilliance-on footer{color:#493f73}
#returnNormal{display:none;flex-shrink:0;border:2px solid #ffe46d;border-radius:12px;padding:11px 15px;background:#ffe46d;color:#302451;font-weight:800;font-size:clamp(13px,1.6vw,18px)}
body.brilliance-on #returnNormal{display:block}
@media(max-width:690px){header h1{font-size:clamp(18px,4vw,25px)}body.brilliance-on header{flex-wrap:wrap}body.brilliance-on #returnNormal{order:3;width:100%;margin-top:4px}}
.decimal-range{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.decimal-side{min-width:0}.place-boxes{display:flex;align-items:center;gap:3px}.place-boxes input{width:clamp(26px,3vw,42px);min-width:0;padding:8px 2px;text-align:center;border:2px solid #739c7d;border-radius:8px;font-size:20px}.place-boxes input.whole{width:clamp(26px,3vw,42px);flex:0 0 auto}.place-dot{font-size:24px;font-weight:bold}@media(max-width:650px){.decimal-range{grid-template-columns:1fr}}/* Version 1.10: friendly numeric range entry on phones and tablets. */
.custom-range{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.custom-range label{display:flex;flex-direction:column;gap:7px}
.custom-range input{min-width:0;width:100%;font-size:clamp(22px,3vw,29px);padding:12px;border:2px solid #739c7d;border-radius:12px;color:#13372b;background:#fff;font-variant-numeric:tabular-nums}
.range-error{color:#a32918;font-size:15px;font-weight:700;margin:0}
body.brilliance-on .custom-range input{border-color:#b67ae7;background:#fcf4ff;color:#6a2fad}

/* v1.7: subtle vertical tightening, retaining the existing visual design. */
@media (min-width:691px) {
 header{min-height:92px;padding-top:9px;padding-bottom:9px}
 header img{max-height:80px}
 main{padding:clamp(10px,1.5vw,18px);gap:14px}
 .panel{padding:clamp(12px,1.7vw,21px);gap:12px}
 .digit{min-height:clamp(135px,22vh,230px)}
 .time{padding:18px 4px}
 .selector{padding:11px}
 .primary,.secondary,.gold{padding:13px 14px;min-height:58px}
}
.time{font-feature-settings:"tnum" 1; font-variant-numeric:tabular-nums; font-family:system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:0}
#brilliance{padding:12px}
.brilliance-card{padding:clamp(12px,2vw,22px)}
.brilliance-card img{max-height:38vh}
.brilliance-card h2{margin:8px 0}
.brilliance-card p{margin:8px 0 14px}
@media (max-height:760px) and (min-width:691px) {
 header{min-height:78px}
 header img{max-height:68px}
 main{padding:9px;gap:12px}
 .panel{padding:12px;gap:9px}
 .digit{min-height:125px}
 .time{padding:12px 4px}
 .brilliance-card img{max-height:32vh}
}

/* 1.8: compact automatic generation and horizontal history */
.interval-label{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
.interval-label input{width:76px;padding:8px;border:2px solid #739c7d;border-radius:9px;font-size:18px}
.history-heading{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.history-clear{border:0;background:transparent;color:#176a49;text-decoration:underline;font-weight:700;padding:4px 8px}
.number-history{display:flex;gap:8px;overflow-x:auto;min-height:46px;align-items:center;padding:8px;background:#f4f9f2;border:2px solid #c4d4c8;border-radius:10px;scrollbar-width:thin}
.number-history span:not(.history-empty){flex:0 0 auto;background:white;border:1px solid #b5cdbb;border-radius:7px;padding:5px 9px;font-weight:750;font-variant-numeric:tabular-nums}
.history-empty{color:#60776a;font-size:14px}
.brilliance-card .brilliance-version{margin-top:24px}
body.brilliance-on .number-history{background:#fcf4ff;border-color:#b67ae7}

<main><section class="panel" aria-label="Number generator"><h2>Random Number</h2><label for="range">Choose a number range</label><select id="range" class="selector"><option value="custom" selected>Custom</option><option value="tenths">Custom Tenths</option><option value="hundredths">Custom Hundredths</option><option value="thousandths">Custom Thousandths</option><option value="digit">One digit (0–9)</option><option value="20">0–20</option><option value="100">0–100</option><option value="1000">0–1,000</option><option value="10000">0–10,000</option><option value="100000">0–100,000</option><option value="1000000">0–1,000,000</option></select><div id="customRange" class="custom-range"><label for="rangeFrom">From<input id="rangeFrom" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="1" aria-describedby="rangeError"></label><label for="rangeTo">To<input id="rangeTo" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="10" aria-describedby="rangeError"></label></div><div id="decimalRange" class="decimal-range" hidden></div><p id="rangeError" class="range-error" role="alert" hidden></p><div class="digit" id="number" aria-live="polite" aria-atomic="true">7</div><div class="controls"><button type="button" class="gold" id="generate">New Number</button><button type="button" class="secondary" id="autoPlay" aria-pressed="false">▶ Play</button></div>
<label class="interval-label" for="autoSeconds">Advance every <input id="autoSeconds" type="number" inputmode="decimal" min="0.5" max="120" step="0.5" value="2" aria-label="Seconds between numbers"> seconds</label>
<div class="history-heading"><strong>Number History</strong><button type="button" class="history-clear" id="clearHistory">Clear</button></div>

// Generate whole numbers or exact decimal place values without floating-point drift.
const decimalPlaces={tenths:1,hundredths:2,thousandths:3};
let autoTimer=null,numberHistory=[];
function selectedRange(){
 const option=$('range').value,places=decimalPlaces[option]||0;
 if(option!=='custom'&&!places)return {min:0,max:option==='digit'?9:Number(option),places:0};
 if(places){const get=side=>{const w=document.getElementById(side+'Whole');const d=[...document.querySelectorAll('#'+side+'Digits input')];return w&&/^\d+$/.test(w.value)&&d.length===places&&d.every(x=>/^\d$/.test(x.value))?Number(w.value)*10**places+Number(d.map(x=>x.value).join('')):null};const min=get('from'),max=get('to');return min!==null&&max!==null&&Number.isSafeInteger(min)&&Number.isSafeInteger(max)&&min<=max?{min,max,places}:null;}
 const from=$('rangeFrom').value.trim(),to=$('rangeTo').value.trim();
 const valid=places?/^\d+(?:\.\d+)?$/:/^\d+$/;

  const input=$(id);input.inputMode=places?'decimal':'numeric';input.pattern=places?'[0-9]*[.]?[0-9]*':'[0-9]*';
 }
 if(places){const host=$('decimalRange');host.replaceChildren();for(const side of ['from','to']){const section=document.createElement('div');section.className='decimal-side';const label=document.createElement('label');label.textContent=side==='from'?'From':'To';section.appendChild(label);const boxes=document.createElement('div');boxes.className='place-boxes';const whole=document.createElement('input');whole.id=side+'Whole';whole.className='whole';whole.type='text';whole.inputMode='numeric';whole.value=side==='from'?'0':'10';whole.setAttribute('aria-label',side+' whole number');boxes.appendChild(whole);const dot=document.createElement('span');dot.className='place-dot';dot.textContent='.';boxes.appendChild(dot);const digits=document.createElement('span');digits.id=side+'Digits';digits.style.display='contents';for(let i=0;i<places;i++){const digit=document.createElement('input');digit.type='text';digit.inputMode='numeric';digit.maxLength=1;digit.value='0';digit.setAttribute('aria-label',side+' decimal place '+(i+1));digits.appendChild(digit)}boxes.appendChild(digits);section.appendChild(boxes);host.appendChild(section);const all=[whole,...digits.querySelectorAll('input')];all.forEach((input,i)=>{input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(0,input===whole?8:1);showRangeError('');if(input!==whole&&input.value&&all[i+1])all[i+1].focus()});input.addEventListener('blur',()=>{if(!input.value)input.value='0'});input.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!input.value&&i>0)all[i-1].focus()})})}}
 else if(option==='custom'){$('rangeFrom').value='1';$('rangeTo').value='10';}

function recordNumber(value){
 numberHistory.unshift(value);numberHistory=numberHistory.slice(0,20);
 const container=$('numberHistory');container.replaceChildren();
 for(const n of numberHistory){const el=document.createElement('span');el.textContent=n;container.appendChild(el)}
 container.scrollLeft=0;
}
function generateNumber(){
 const range=selectedRange();
 if(!range){showRangeError('Enter a valid positive range, with From no greater than To, and the selected number of decimal places.');stopAuto();return false}
 showRangeError('');
 const span=range.max-range.min+1;
 if(!Number.isSafeInteger(span)||span<=0){showRangeError('Range is too large.');stopAuto();return false}
 const n=range.min+Math.floor(Math.random()*span);
 const value=range.places?(n/(10**range.places)).toFixed(range.places):n.toLocaleString('en-AU');
 $('number').textContent=value;
 $('number').classList.toggle('small',value.length>7);
 recordNumber(value);return true;
}
function stopAuto(){
 if(autoTimer!==null){clearTimeout(autoTimer);autoTimer=null}
 $('autoPlay').textContent='▶ Play';$('autoPlay').setAttribute('aria-pressed','false');
}
function autoStep(){
 if(!generateNumber())return;
 const seconds=Number($('autoSeconds').value);
 if(!Number.isFinite(seconds)||seconds<0.5||seconds>120){stopAuto();return}
 autoTimer=setTimeout(autoStep,seconds*1000);
}
$('generate').addEventListener('click',generateNumber);
$('autoPlay').addEventListener('click',()=>{
 if(autoTimer!==null){stopAuto();return}
 const seconds=Number($('autoSeconds').value);
 if(!Number.isFinite(seconds)||seconds<0.5||seconds>120){showRangeError('Choose an interval between 0.5 and 120 seconds.');return}
 $('autoPlay').textContent='⏸ Pause';$('autoPlay').setAttribute('aria-pressed','true');

});

['rangeFrom','rangeTo'].forEach(id=>$(id).addEventListener('input',()=>showRangeError('')));

refreshRange();
let mode='countdown',preset=30,elapsed=0,remaining=30000,running=false,lastStart=0,frame=null,finishOnce=false,audioCtx=null;
const now=()=>performance.now();
const format=ms=>{const seconds=Math.floor(Math.max(0,ms)/1000);const mins=Math.floor(seconds/60);const sec=seconds%60;if(mode==='countdown')return String(mins).padStart(2,'0')+':'+String(sec).padStart(2,'0');return String(mins).padStart(2,'0')+':'+String(sec).padStart(2,'0')+'.'+String(Math.floor((Math.max(0,ms)%1000)/100))};
function stopFrame(){if(frame!==null)cancelAnimationFrame(frame);frame=null}
function render(){const ms=mode==='stopwatch'?elapsed:remaining;$('clock').textContent=format(ms);$('start').textContent=running?'Pause':(mode==='countdown'&&remaining<=0?'Restart':'Start')}
function silence(){if(audioCtx){audioCtx.close().catch(()=>{});audioCtx=null}}
function clearAlert(){ $('finished').textContent='';$('clock').classList.remove('up','pulse') }
function chime(){if(!$('sound').checked)return;try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;const ctx=audioCtx||new Ctx();audioCtx=ctx;if(ctx.state==='suspended')ctx.resume();const t=ctx.currentTime+.02;[0,.68].forEach(delay=>{[660,880].forEach((hz,i)=>{const osc=ctx.createOscillator(),gain=ctx.createGain();const at=t+delay+i*.17;osc.type='sine';osc.frequency.value=hz;gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(.16,at+.025);gain.gain.exponentialRampToValueAtTime(.0001,at+.3);osc.connect(gain).connect(ctx.destination);osc.start(at);osc.stop(at+.32)})})}catch(e){}}

function finished(){running=false;stopFrame();remaining=0;render();if(!finishOnce){finishOnce=true;$('finished').textContent="TIME'S UP!";$('clock').classList.add('up');if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches)$('clock').classList.add('pulse');chime()}}
function tick(){if(!running)return;let dt=now()-lastStart;lastStart=now();if(mode==='stopwatch'){elapsed+=dt}else{remaining=Math.max(0,remaining-dt);if(remaining<=0){finished();return}}render();frame=requestAnimationFrame(tick)}
function pause(){running=false;stopFrame();render()}
function changeMode(next){pause();mode=next;elapsed=0;remaining=preset*1000;finishOnce=false;clearAlert();$('stopwatchMode').setAttribute('aria-pressed',String(mode==='stopwatch'));$('countdownMode').setAttribute('aria-pressed',String(mode==='countdown'));$('presets').hidden=mode!=='countdown';render()}
$('stopwatchMode').addEventListener('click',()=>changeMode('stopwatch'));
$('countdownMode').addEventListener('click',()=>changeMode('countdown'));
$('presets').querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{pause();preset=Number(btn.dataset.seconds);remaining=preset*1000;finishOnce=false;clearAlert();$('presets').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));render()}));
$('start').addEventListener('click',()=>{if(running){pause();return}if(mode==='countdown'&&remaining<=0){remaining=preset*1000;finishOnce=false;clearAlert()}if(mode==='countdown'&&$('sound').checked){try{const Ctx=window.AudioContext||window.webkitAudioContext;if(Ctx){audioCtx=audioCtx||new Ctx();audioCtx.resume().catch(()=>{})}}catch(e){}}running=true;lastStart=now();clearAlert();render();frame=requestAnimationFrame(tick)});
$('reset').addEventListener('click',()=>{pause();elapsed=0;remaining=preset*1000;finishOnce=false;clearAlert();render()});
// Reconcile timer with elapsed real time after a tab resumes.
render();let taps=0,firstTap=0;
$('schoolLogo').addEventListener('click',()=>{const time=now();if(time-firstTap>4500){taps=0;firstTap=time}taps++;if(taps>=7){taps=0;firstTap=0;$('encouragement').textContent=messages[Math.floor(Math.random()*messages.length)];$('brilliance').classList.add('active');$('brilliance').setAttribute('aria-hidden','false');$('continueBrilliance').focus()}});
$('continueBrilliance').addEventListener('click',()=>{document.body.classList.add('brilliance-on');$('brilliance').classList.remove('active');$('brilliance').setAttribute('aria-hidden','true');$('generate').focus()});
$('returnNormal').addEventListener('click',()=>location.reload());
